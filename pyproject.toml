[project]
name = "trading-system"
version = "0.1.0"
description = "AI Trading Agent Research & Engineering Project — Cumulative Slices 1–4"
requires-python = ">=3.11"
readme = "README.md"

# No runtime dependencies for Slice 0/1: domain models are pure stdlib
# (dataclasses, enum, uuid, datetime). This is deliberate — see
# docs/dependency-decisions.md for the rationale (Technology discipline
# section of the implementation prompt).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: each top-level plane directory (governance/, data/, domain/, ...)
# is a first-class Python package rooted at the repo root, matching the
# directory structure mandated by Stage 3 §1 exactly (no src/ indirection).
packages = [
    "governance", "governance.config", "governance.autonomy", "governance.killswitch",
    "data", "data.adapters", "data.validation", "data.normalization", "data.features", "data.schemas",
    "domain", "domain.models",
    "intelligence", "intelligence.baseline", "intelligence.llm_component", "intelligence.interface",
    "risk_execution", "risk_execution.cost_model", "risk_execution.risk_engine",
    "risk_execution.sizing", "risk_execution.order_state_machine", "risk_execution.broker",
    "observability", "observability.decision_log", "observability.reconciliation", "observability.reporting",
    "research", "research.harness", "research.contamination", "research.stats",
    "research.experiments", "research.promotion",
    "shared", "shared.versioning", "shared.time", "shared.config_loader", "shared.arch_lint", "shared.costs", "risk_execution.broker.adapters",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
